<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepBlue Vision</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --panel-border: #333333;
      --accent-blue: #1e88e5;
      --accent-blue-hover: #1565c0;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --status-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); font-size: 13px; line-height: 1.4; }

    /* Top Navigation Header */
    header { background: #000; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; height: 40px; }
    .header-title { font-weight: bold; font-size: 14px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .nav-tabs { display: flex; height: 100%; }
    .nav-tab { padding: 0 15px; display: flex; align-items: center; background: #262626; color: var(--text-muted); text-decoration: none; font-weight: 600; border-right: 1px solid #121212; cursor: pointer; }
    .nav-tab.active { background: var(--accent-blue); color: #fff; }

    /* Main Layout */
    main { padding: 8px 0 10px; max-width: 1600px; margin: 0 auto; }

    /* Login Form Styles */
    .login-wrapper { display: grid; place-items: center; min-height: 80vh; }
    .login-card { background: var(--panel-bg); padding: 2rem; border: 1px solid var(--panel-border); border-radius: 6px; width: 320px; display: grid; gap: 1rem; }
    .login-card h2 { color: var(--accent-blue); font-size: 18px; text-align: center; }
    .form-group { display: grid; gap: 4px; }
    .form-group input { padding: 8px; background: #121212; border: 1px solid var(--panel-border); color: #fff; border-radius: 4px; }
    .btn-login { padding: 8px; background: var(--accent-blue); border: 0; color: #fff; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .btn-login:hover { background: var(--accent-blue-hover); }

    /* Dashboard Layout Grid */
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px; align-items: start; }

    /* Main camera and AI mode panels */
    .left-panel { display: contents; }
    
    /* Video Box */
    .video-card { background: var(--panel-bg); border: 1px solid var(--panel-border); position: relative; }
    .video-viewport { width: 100%; height: 480px; background: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #stream { width: 100%; height: 100%; object-fit: contain; }
    /* Sits above the video but below the text overlays. pointer-events:none so
       it never intercepts clicks meant for the controls underneath. */
    #detection-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .camera-no-feed {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9;
      background: linear-gradient(135deg, rgba(18,18,18,0.9), rgba(32,32,32,0.8));
      border: 1px solid rgba(255,255,255,0.08);
    }
    .camera-no-feed-inner {
      display: grid;
      gap: 8px;
      padding: 18px 24px;
      border-radius: 10px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .camera-no-feed-title {
      color: #ffb300;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .camera-no-feed-text {
      color: var(--text-muted);
      font-size: 12px;
    }
    
    /* Dynamic Green Date Time Overlay */
    .camera-info-overlay { position: absolute; top: 12px; left: 14px; font-family: monospace; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px #000; color: #00ff00; z-index: 10; }
    .camera-fps-overlay {
      position: absolute;
      left: 14px;
      top: 120px;
      z-index: 10;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.15);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #9ae6ff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* Video Control Action Toolbar */
    .toolbar { background: #181818; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--panel-border); }
    .btn { padding: 6px 16px; background: var(--accent-blue); color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-secondary { background: #3a3a3a; color: var(--text-main); }
    .btn:hover { opacity: 0.9; }

    .switch-container { display: flex; align-items: center; gap: 8px; background: var(--status-bg); padding: 5px 12px; border-radius: 3px; border: 1px solid var(--panel-border); }
    #camera-toggle { accent-color: var(--accent-blue); cursor: pointer; width: 16px; height: 16px; }
    #camera-status { font-weight: bold; color: #888; font-size: 12px; }
    #camera-status.active { color: #00ff00; }
    .record-duration {
      display: inline-block;
      min-width: 86px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      color: #ff4d4d;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 77, 77, 0.35);
      background: rgba(255, 77, 77, 0.08);
    }
    .record-duration[hidden] { display: none; }

    /* System Console */
    .right-panel { grid-column: 1 / -1; height: 220px; min-height: 0; }
    .log-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    #log-terminal {
      background: #000;
      color: #00ff00;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.35;
      flex: 1;
      width: 100%;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      overflow-x: auto;
      padding: 8px;
      border: 1px solid #2a2a2a;
      white-space: pre-wrap;
      word-break: break-all;
      border-radius: 3px;
      scrollbar-width: thin;
      scrollbar-color: #4a4a4a #111;
    }

    #log-terminal::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    #log-terminal::-webkit-scrollbar-track {
      background: #111;
      border-radius: 6px;
    }

    #log-terminal::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 6px;
    }

    #log-terminal::-webkit-scrollbar-thumb:hover {
      background: #666;
    }

    /* Right Panel: Snapshots & Controls */
    .right-panel { display: flex; flex-direction: column; gap: 10px; }
    .panel-box { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 10px; }
    .panel-title { font-size: 12px; font-weight: bold; color: var(--text-muted); border-bottom: 1px solid #2a2a2a; padding-bottom: 6px; margin-bottom: 10px; }

    /* Enlarged Snapshot Area */
    /* Settings Controls */
    .control-group { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 6px; margin-bottom: 8px; }
    .control-group select, .control-group input { background: #121212; border: 1px solid var(--panel-border); color: #fff; padding: 4px; border-radius: 3px; font-size: 11px; }

    .plugin-shell { max-width: 1180px; margin: 0; }
    .plugin-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--panel-border); }
    .plugin-header .panel-title { margin: 0; border: 0; padding: 0; }
    .plugin-actions { display: flex; align-items: center; gap: 5px; }
    .plugin-header .btn { padding: 4px 9px; font-size: 11px; }
    .plugin-layout { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); height: 238px; min-height: 0; }
    .plugin-list { min-height: 0; padding: 7px; display: grid; align-content: start; gap: 5px; border-right: 1px solid var(--panel-border); overflow-y: auto; }
    .plugin-card { display: block; padding: 5px 7px; min-height: 32px; background: #181818; border: 1px solid #303030; color: var(--text-main); text-align: left; cursor: pointer; }
    .plugin-card:hover, .plugin-card.selected { border-color: var(--accent-blue); background: #202020; }
    .plugin-card-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; min-width: 0; }
    .plugin-card-name { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 13px; }
    .plugin-status { flex: 0 0 auto; display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .plugin-status.active { color: #00ff00; }
    .plugin-status.disabled { color: #ffb300; }
    .plugin-status.loading { color: #4ea1ff; }
    .plugin-status.unloading { color: #ff8a00; }
    .plugin-status.unloaded { color: #888; }
    .plugin-settings { min-height: 0; padding: 10px 12px; overflow-y: auto; }
    .plugin-settings-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .plugin-settings-subtitle { color: var(--text-muted); font-size: 10px; margin-bottom: 9px; }
    .plugin-setting { display: grid; gap: 5px; padding: 8px 0; border-top: 1px solid #2a2a2a; }
    .plugin-setting label { color: var(--text-muted); font-size: 10px; }
    .plugin-range-row { display: grid; grid-template-columns: 1fr 42px; gap: 10px; align-items: center; }
    .plugin-range-row input[type="range"] { accent-color: var(--accent-blue); width: 100%; }
    .plugin-range-value { color: #fff; font-family: monospace; font-size: 12px; }
    .plugin-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .plugin-empty { color: var(--text-muted); padding: 18px 8px; font-size: 11px; }
    .main-plugin-panel { margin: 0; max-width: none; overflow: hidden; }
    .main-plugin-panel .plugin-layout { height: 238px; min-height: 0; }
    @media (max-width: 760px) { .dashboard-grid { grid-template-columns: 1fr; } .main-plugin-panel { grid-column: auto; } .plugin-layout { grid-template-columns: 1fr; } .plugin-list { border-right: 0; border-bottom: 1px solid var(--panel-border); } }

    .query-shell { max-width: 1400px; margin: 18px auto; display: grid; gap: 14px; }
    .query-filter-bar {
      background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 12px;
      display: grid; grid-template-columns: minmax(220px, 2.6fr) minmax(180px, 1.2fr) minmax(180px, 1fr);
      gap: 12px; align-items: end;
    }
    .query-search input, .query-filter-bar select, .query-filter-bar input {
      width: 100%; background: #121212; border: 1px solid var(--panel-border); color: #fff; padding: 8px 10px; border-radius: 4px; font-size: 12px;
    }
    .query-search {
      position: relative;
    }
    .query-search .search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px;
    }
    .query-search input { padding-left: 30px; }
    .query-date-group { display: flex; gap: 10px; }
    .query-date-field { display: grid; gap: 5px; flex: 1; }
    .query-field-label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .query-session-list { display: grid; gap: 10px; }
    .query-session-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
    .query-session-row {
      width: 100%; background: #202020; border: 0; color: var(--text-main); text-align: left; cursor: pointer;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px;
    }
    .query-session-row:hover { background: #262626; }
    .query-session-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .query-session-date { font-weight: 600; color: #d9d9d9; }
    .query-session-id { color: var(--text-muted); font-family: 'Consolas', monospace; }
    .query-session-icons { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 6px; }
    .query-media-icon {
      display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px;
      border-radius: 4px; background: rgba(30,136,229,0.12); border: 1px solid rgba(30,136,229,0.2); color: #a4d4ff; font-size: 12px;
    }
    .query-session-toggle { font-size: 16px; color: var(--text-muted); min-width: 18px; text-align: center; }
    .query-session-body { display: none; padding: 0 12px 12px; }
    .query-session-card.expanded .query-session-body { display: block; }
    .query-tree {
      background: #151515; border: 1px solid var(--panel-border); border-radius: 4px; padding: 8px 10px; display: grid; gap: 6px;
    }
    .query-node { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 12px; }
    .query-node.folder > .query-node-main { color: #d9d9d9; font-weight: 600; }
    .query-node.file > .query-node-main { color: #b5d4ff; }
    .query-node-main {
      display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1;
    }
    .query-file-link {
      color: #cfe4ff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .query-file-link:hover { text-decoration: underline; }
    .query-empty-state { padding: 20px; text-align: center; color: var(--text-muted); background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="header-title">
      <span style="color: var(--accent-blue);">■</span> DeepBlue Vision
    </div>
    <div class="nav-tabs">
      <div class="nav-tab active">Main</div>
      <div class="nav-tab">Query data</div>
    </div>
  </header>

  <main>
    <!-- 1. Authentication Login Screen -->
    <div id="login-container" class="login-wrapper">
      <form id="login-form" class="login-card">
        <h2>DeepBlue Vision Login</h2>
        <div class="form-group">
          <label>Username</label>
          <input name="username" autocomplete="username" required value="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Login</button>
        <p id="login-message" style="color: #ff5252; font-size: 11px; text-align: center;"></p>
      </form>
    </div>

    <!-- 2. Dashboard -->
    <div id="view-video">
      <div id="dashboard" class="dashboard-grid" hidden>
      
        <!-- Left Column: Stream and AI mode -->
        <div class="left-panel">
          <div class="video-card">
            <div class="video-viewport">
              <div id="live-datetime" class="camera-info-overlay">--/--/---- --:--:--</div>
              <div id="camera-fps-indicator" class="camera-fps-overlay">FPS 0.0</div>
              <div id="camera-no-feed" class="camera-no-feed" aria-live="polite">
                <div class="camera-no-feed-inner">
                  <div class="camera-no-feed-title">No Camera</div>
                  <div class="camera-no-feed-text">Connected</div>
                </div>
              </div>
              <img id="stream" alt="Live camera stream" hidden>
              <canvas id="detection-overlay" hidden></canvas>
            </div>

            <div class="toolbar">
              <div class="switch-container">
                <input id="camera-toggle" type="checkbox">
                <label for="camera-toggle" style="cursor: pointer;">Camera Power</label>
                <span id="camera-status">Stopped</span>
              </div>

              <div style="display:flex; align-items:center; gap:8px;">
                <span id="record-status-indicator" style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#a0a0a0;">
                  <span style="width:10px; height:10px; border-radius:50%; background:#666; display:inline-block;"></span>
                  <span id="record-status-text">Idle</span>
                </span>
                <span id="record-duration" class="record-duration" hidden>00:00:00</span>
                <button id="record-toggle-btn" class="btn btn-secondary">Start Record</button>
                <button id="restart-record-btn" class="btn btn-secondary">Restart</button>
                <button id="capture-btn" class="btn btn-secondary">Capture</button>
              </div>
            </div>
          </div>

        </div>

        <div class="panel-box plugin-shell main-plugin-panel">
          <div class="plugin-header">
            <div class="panel-title">Choose AI Vision Mode</div>
            <div class="plugin-actions">
              <button id="disable-plugin-btn" class="btn btn-secondary" type="button" disabled>Disable</button>
              <button id="scan-plugins-btn" class="btn btn-secondary" type="button">&#8635; Scan</button>
            </div>
          </div>
          <div class="plugin-layout">
            <div id="plugin-list" class="plugin-list"></div>
            <section id="plugin-settings" class="plugin-settings" aria-live="polite">
              <div class="plugin-empty">Select a plugin to view its settings.</div>
            </section>
          </div>
        </div>

        <!-- Right Column: System Console -->
        <div class="right-panel">
          <div class="log-panel">
            <div class="panel-title">System Console Logs</div>
            <div id="log-terminal">Loading session logs...</div>
          </div>

        </div>

      </div>
    </div>

    <div id="view-query" hidden>
      <div class="query-shell">
        <div class="query-filter-bar">
          <div class="query-search">
            <span class="search-icon">⌕</span>
            <input id="query-search" type="text" placeholder="Search media" aria-label="Search media">
          </div>

          <div class="query-date-field">
            <label class="query-field-label" for="query-date-filter">Date</label>
            <input id="query-date-filter" type="date">
          </div>

          <div class="query-date-field">
            <label class="query-field-label" for="query-type-filter">Type</label>
            <select id="query-type-filter">
              <option value="all">All</option>
              <option value="video">Video</option>
              <option value="capture">Captured Photo</option>
            </select>
          </div>
        </div>

        <div id="query-session-list" class="query-session-list"></div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
