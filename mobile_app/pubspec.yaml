name: vision_ai_box
description: "On-device face and object detection with the phone camera (Deep Blue AI Lab)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  google_mlkit_commons: 1.0.3
  google_mlkit_face_detection: 1.0.3
  google_mlkit_object_detection: 1.0.3
  material_ui: 1.11.1
  cupertino_icons: 1.0.8
  permission_handler: 13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
